[project]
name = "mewhelp-ai"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Ethan_Leo", email = "xuesongzhi813@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "fastapi>=0.143.0",
    "langchain>=1.4.5",
    "langchain-openai>=1.7.1",
    "openai>=3.31",
    "pydantic-settings>=2.15.0",
    "pymilvus>=3.0",
    "pymysql>=1.2.3",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
    "langgraph==1.2.15",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "mcp==1.30.0",
    "jsonschema==4.25.1",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: 需要真实外部服务的集成测试"]
