<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知识改进 · 待审队列</title><link rel="stylesheet" href="/static/flywheel.css"></head>
<body class="admin-body"><main class="admin-wrap">
<header class="admin-hero"><h1>把未解决的问题，<span>变成知识</span></h1><p>先对照用户原话与当时证据审核，再确认标注影响，让知识安全生效。</p></header>
<section class="admin-card"><div class="admin-card-head"><h2>待审队列</h2><span id="queueCount" class="fly-badge">读取中</span></div>
<p class="fly-note">AI 示例答案仅供备查。审核通过代表人工核准；完成影响确认和发布后，知识才会生效。驳回后不会自动重开。</p>
<div class="fly-toolbar"><label>审核状态 <select id="statusFilter"><option>待审</option><option>通过</option><option>驳回</option><option value="">全部</option></select></label><button id="reloadQueue">刷新</button><button id="previewBatch">检查所选知识的标注影响</button><span id="selectionCount" class="fly-note">已选 0 条核准知识</span></div>
<p id="queueMessage" class="fly-status" role="status"></p><div class="fly-table-wrap"><table class="fly-table"><thead><tr><th>选择</th><th>标准问题</th><th>出现次数</th><th>AI 示例答案</th><th>审核状态</th><th>操作</th></tr></thead><tbody id="queueRows"></tbody></table></div>
<div class="fly-toolbar"><button id="previousPage" disabled>上一页</button><button id="nextPage" disabled>下一页</button></div></section>
<section class="admin-card" style="margin-top:22px"><div class="admin-card-head"><h2>发布与恢复</h2><button id="reloadReleases">刷新状态</button></div><p class="fly-note">知识写入或校准期间，知识问答会显示维护提示，订单等业务继续可用。失败后续跑会沿用本次发布记录。</p><p id="releaseMessage" class="fly-status" role="status"></p><div id="releaseRows"></div></section>
</main>
<dialog id="detailDialog" class="fly-dialog"><button class="fly-close" type="button" data-close>关闭</button><h2 id="detailTitle">审核详情</h2><div class="fly-detail-grid"><section><h3>用户原话与当时的证据</h3><div id="eventRows"></div></section><section><h3>人工核准</h3><p id="detailState" class="fly-note"></p><label class="fly-field"><span>AI 示例答案（仅供参考）</span><textarea id="suggestedAnswer" rows="5" readonly></textarea></label><label class="fly-field"><span>核准答案</span><textarea id="approvedAnswer" rows="9" placeholder="请核实事实后填写或修改答案"></textarea></label><div class="fly-toolbar"><button id="approveReview">通过并加入发布批</button><button id="rejectReview">驳回</button><button id="selectApproved">加入发布批</button></div><p id="detailMessage" class="fly-status" role="status"></p></section></div></dialog>
<dialog id="impactDialog" class="fly-dialog"><button class="fly-close" type="button" data-close>关闭</button><h2>确认新知识对评估标注的影响</h2><p class="fly-note">模型只提出建议。请按核准知识确认事实和来源；原题、题号及 24/72 分割保持固定。不要根据生成分数调整标注。</p><div id="impactKnowledge"></div><p id="impactSummary" class="fly-note"></p><div id="impactCases"></div><div class="fly-confirm"><label class="fly-field"><span>审核标识（仅作填写记录）</span><input id="confirmedBy" type="text" maxlength="100" placeholder="填写你的审核标识"></label><label class="fly-check"><input id="confirmUnchanged" type="checkbox"><span>我已核实以上修订，并确认其余未修改的题目保持不变。</span></label><button id="confirmPublish">确认标注并发布</button><p id="impactMessage" class="fly-status" role="status"></p></div></dialog>
<script src="/static/admin.js" data-page="review"></script><script src="/static/review.js"></script></body></html>
